<h1>Chính sách bảo mật</h1>
<p>gsed là công cụ cá nhân, chỉ chủ sở hữu sử dụng.</p>
<p>Ứng dụng chỉ xin quyền drive.file để tạo và cập nhật file kết quả trong thư mục Drive của chính chủ.</p>
<p>Ứng dụng không thu thập, lưu trữ, chia sẻ hay bán dữ liệu của bất kỳ ai khác.</p>
